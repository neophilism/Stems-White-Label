# Review-only Blueprint. Applying it provisions paid worker services.
# Do not apply until worker cost is explicitly approved and shared secrets are set.
# The existing web service is not replaced or duplicated by this file.
services:
  - type: worker
    name: stems-asset-worker
    runtime: docker
    repo: https://github.com/neophilism/Stems-White-Label
    branch: main
    region: virginia
    plan: starter
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node --import tsx scripts/asset-worker.ts
    maxShutdownDelaySeconds: 300
    envVars:
      - fromGroup: stems-private-media
      - key: ASSET_WORKER_POLL_MS
        value: "2000"
      - key: ASSET_WORKER_STALE_MINUTES
        value: "20"
  - type: worker
    name: stems-package-worker
    runtime: docker
    repo: https://github.com/neophilism/Stems-White-Label
    branch: main
    region: virginia
    plan: starter
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node --import tsx scripts/download-package-worker.ts
    maxShutdownDelaySeconds: 300
    envVars:
      - fromGroup: stems-private-media
      - key: PACKAGE_WORKER_POLL_MS
        value: "2000"
      - key: PACKAGE_WORKER_STALE_MINUTES
        value: "30"
