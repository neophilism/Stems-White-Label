name: Public deployment readiness (on-demand)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify configured production origin when one exists
        if: ${{ vars.STEMS_SITE_URL != '' }}
        env:
          STEMS_SITE_URL: ${{ vars.STEMS_SITE_URL }}
        run: node scripts/live-smoke.mjs
      - name: Explain why external readiness was not attempted
        if: ${{ vars.STEMS_SITE_URL == '' }}
        run: echo 'No STEMS_SITE_URL is configured. Hosted readiness NOT VERIFIED; suspended Render endpoint not probed.' >> "$GITHUB_STEP_SUMMARY"
