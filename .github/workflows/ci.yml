name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stems_white_label
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stems_white_label?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret
      GITHUB_ID: ci-client
      GITHUB_SECRET: ci-secret
      DEFAULT_TENANT_SLUG: unsealed-records
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip
      - run: npm ci
      - run: npm run test:commerce-migration
      - run: npm run db:deploy
      - run: npm test
      - run: node --test scripts/live-smoke.test.mjs
      - run: npm run test:queue-integration
      - run: npm run test:cms-integration
      - run: npm run test:navigation-integration
      - run: npm run test:theme-integration
      - run: npm run test:domains-integration
      - run: npm run test:commerce-integration
      - run: npm run test:billing-integration
      - run: npm run test:analytics-integration
      - run: npm run test:platform-admin-integration
      - run: npm run test:team-integration
      - run: npm run test:demo-integration
      - run: npm run test:licensing-integration
      - run: npm run test:payment-integration
      - run: npm run test:checkout-integration
      - run: npm run test:delivery-integration
      - run: npm run test:package-integration
      - run: npm run test:media-integration
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:http-security

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployable web and worker container
        run: docker build --tag stems-ci .
      - name: Verify non-root runtime and media tooling
        run: |
          docker run --rm stems-ci node -e "if (process.getuid() === 0) process.exit(1); require('@prisma/client'); console.log('Non-root Prisma runtime ready')"
          docker run --rm stems-ci ffmpeg -version
          docker run --rm stems-ci ffprobe -version
