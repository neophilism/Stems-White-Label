name: Build portable Stems storefront container
on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/portable-image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/portable-image.yml
permissions:
  contents: read
  packages: write
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to registry only for approved main image
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and conditionally publish immutable Node 22 / Next.js 16 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/neophilism/stems-white-label:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/neophilism/Stems-White-Label
            org.opencontainers.image.revision=${{ github.sha }}
      - run: echo 'Image build alone is not a live media service or a tested database/auth deployment.' >> "$GITHUB_STEP_SUMMARY"
